name: Publish Container

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'backend-v*.*.*'
      - 'container-*'
    paths:
      - 'ScraperBackendService/**'
      - '.dockerignore'
      - '.github/workflows/publish-container.yml'

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build native image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ScraperBackendService/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}
      - name: Check backend and native Chromium
        env:
          IMAGE: ${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ matrix.arch }}
          NODE_ARCH: ${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
        run: |
          docker run -d --name smoke --init --shm-size=1g -p 127.0.0.1:18585:8585 "$IMAGE"
          curl --fail --silent --show-error --retry 60 --retry-delay 2 \
            --retry-all-errors --connect-timeout 2 --max-time 5 \
            --retry-max-time 120 http://127.0.0.1:18585/health
          docker exec -i smoke "/app/.playwright/node/linux-$NODE_ARCH/node" <<'JS'
          const { chromium } = require('/app/.playwright/package');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.setContent('<title>Hanimeta browser check</title><script>document.title += " passed";</script>');
            const title = await page.title();
            if (title !== 'Hanimeta browser check passed') throw new Error(title);
            console.log(JSON.stringify({ browser: browser.version(), title }));
            await browser.close();
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs smoke || true
          docker rm -f smoke || true
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push checked architecture
        env:
          IMAGE: ${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ matrix.arch }}
        run: docker push "$IMAGE"

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=match,pattern=backend-v(.*),group=1
            type=match,pattern=container-(.*),group=1
            type=sha,format=long
      - name: Merge checked images
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do tag_args+=(--tag "$tag"); done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${tag_args[@]}" \
            "$IMAGE:build-$GITHUB_SHA-amd64" "$IMAGE:build-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
